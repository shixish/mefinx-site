        stroke="url(#mefinx-arch)"
      />
      <path
        d="M24.69 63.74C20.34 67.57 20.47 82.4 28.41 82.49C29.77 82.51 31.31 82.13 32.41 81.28C34.1 79.97 42.68 68.43 43.62 66.39C43.79 66.01 43.51 65.69 43.68 65.3"
        stroke="url(#mefinx-bowl)"
      />
      <path
        d="M37.15 55.84C38.51 61.62 33.72 66.6 28.76 68.66C28.26 68.87 28.42 69.49 27.98 69.61"
        stroke="url(#mefinx-swoop)"
      />
      <path
        d="M52.89 33.76C55.29 32.26 58.74 36.22 58.13 38.46"
        stroke="#53adcb"
      />
      <path
        d="M58.75 46.96C58.68 41.49 70.85 37.73 76.42 41.55C82.36 45.62 83.62 53.77 80.77 60.09C79.89 62.05 78.29 63.47 77.44 65.36"
        stroke="url(#mefinx-amber)"
      />
      <path d="M50.4 52.7L52.7 56.4L50.3 59.4L47.7 55.6Z" fill="#eac24f" stroke="none" />
    </g>
  </defs>
  <use href="#mefinx-strands" filter="url(#mefinx-wash)" opacity="0.4" />
  <use href="#mefinx-strands" filter="url(#mefinx-glow)" opacity="0.45" />
  <use href="#mefinx-strands" />
  <use href="#mefinx-strands" filter="url(#mefinx-core)" opacity="0.26" />
</svg>
