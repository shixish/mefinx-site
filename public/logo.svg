<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="512" height="512" role="img" aria-label="mefinx">
  <title>mefinx</title>
  <!--
    The mefinx mark, as vector.

    A recreation of public/logo512.png, which is a raster and the only form the mark ever existed in.
    Every number below was measured rather than judged: the PNG was decoded, each strand's centreline
    walked onto the ridge of the tube it belongs to, each cap found by walking out along the tangent
    to where the tube's own brightness halves, each colour stop read as the brightness-weighted mean
    across the tube at that point, and the whole thing fitted to the fewest cubic curves that stay
    within an eighth of a stroke width of that centreline. Thirteen shapes and thirty-odd curves.

    Three figures — two with ring heads, the third the open crook the artwork actually draws — whose
    bodies cross into the knot the mark is about. The crook is one unbroken stroke: its loop's left
    side stops dead in a cap, and the long tail is the continuation of the loop's right side.

    The neon is four passes over one set of strokes: a broad wash, a tighter glow, the tube itself,
    then the tube eroded to a thread and whitened for the lit core down its middle.

    No background. The strands are lit colours meant for a dark surface, so whatever shows this needs
    to bring its own — a CSS background on the <img>, or a rect added back here. Leaving it out is
    what makes the file reusable: a plate baked in cannot be taken off again.

    src/components/brand-mark.tsx is this same drawing inline, and the two are kept in step by
    brand-mark.test.ts.
  -->
  <defs>
    <linearGradient id="mefinx-coil" gradientUnits="userSpaceOnUse" x1="32" y1="46" x2="20" y2="42">
      <stop offset="0" stop-color="#5e9ec5" />
      <stop offset="0.82" stop-color="#52add1" />
      <stop offset="0.87" stop-color="#61ccdb" />
      <stop offset="0.94" stop-color="#50aacf" />
      <stop offset="1" stop-color="#5dc5d6" />
    </linearGradient>
    <linearGradient id="mefinx-fall" gradientUnits="userSpaceOnUse" x1="25.6" y1="39.9" x2="65.5" y2="82.5">
      <stop offset="0" stop-color="#60cad7" />
      <stop offset="0.53" stop-color="#54aece" />
      <stop offset="0.56" stop-color="#4d9fc5" />
      <stop offset="0.72" stop-color="#4692bf" />
      <stop offset="1" stop-color="#4ba1c7" />
    </linearGradient>
    <linearGradient id="mefinx-rise" gradientUnits="userSpaceOnUse" x1="65.5" y1="82.5" x2="63.9" y2="48.6">
      <stop offset="0" stop-color="#58b8d1" />
      <stop offset="0.42" stop-color="#54afb9" />
      <stop offset="0.53" stop-color="#5dbec0" />
      <stop offset="0.6" stop-color="#5ab7b1" />
      <stop offset="1" stop-color="#5fbab0" />
    </linearGradient>
    <linearGradient id="mefinx-crookA" gradientUnits="userSpaceOnUse" x1="41.4" y1="26.1" x2="47" y2="14.8">
      <stop offset="0" stop-color="#63a1c1" />
      <stop offset="0.5" stop-color="#9383b4" />
      <stop offset="0.7" stop-color="#bd73ac" />
      <stop offset="1" stop-color="#ca5891" />
    </linearGradient>
    <linearGradient id="mefinx-crookB" gradientUnits="userSpaceOnUse" x1="47" y1="14.8" x2="36.6" y2="37.9">
      <stop offset="0" stop-color="#d34e84" />
      <stop offset="0.47" stop-color="#c65991" />
      <stop offset="0.65" stop-color="#b0508c" />
      <stop offset="0.71" stop-color="#b85e9b" />
      <stop offset="1" stop-color="#ba64a1" />
    </linearGradient>
    <linearGradient id="mefinx-arch" gradientUnits="userSpaceOnUse" x1="43.2" y1="45.8" x2="67.4" y2="68.4">
      <stop offset="0" stop-color="#d04c8a" />
      <stop offset="0.74" stop-color="#d46272" />
      <stop offset="0.81" stop-color="#cd5964" />
      <stop offset="1" stop-color="#c8606a" />
    </linearGradient>
    <linearGradient id="mefinx-bowl" gradientUnits="userSpaceOnUse" x1="21" y1="74" x2="44" y2="66">
      <stop offset="0" stop-color="#d45482" />
      <stop offset="0.22" stop-color="#d35592" />
      <stop offset="0.35" stop-color="#d8678a" />
      <stop offset="0.82" stop-color="#d36f66" />
      <stop offset="1" stop-color="#d98868" />
    </linearGradient>
    <linearGradient id="mefinx-swoop" gradientUnits="userSpaceOnUse" x1="37.1" y1="55.8" x2="28" y2="69.6">
      <stop offset="0" stop-color="#c2547a" />
      <stop offset="0.23" stop-color="#b35b85" />
      <stop offset="0.52" stop-color="#8c82b2" />
      <stop offset="0.64" stop-color="#6b80ba" />
      <stop offset="1" stop-color="#51a3cd" />
