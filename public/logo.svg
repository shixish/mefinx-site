      <circle cx="70.1" cy="28.3" r="5.78" stroke="#eac24f" />
      <path
        d="M30.77 48.22C30.65 48.4 29.98 53.44 26.54 56.86C22.42 60.96 14.92 59.34 12.94 53.92C10.39 46.96 19.02 39.06 25.61 39.9"
        stroke="url(#mefinx-coil)"
      />
      <path
        d="M25.61 39.9C28.2 40.35 30.42 40.82 32.64 42.36C36.61 45.12 49.98 64.67 53.72 69.89C56.31 73.52 60.7 81.96 65.5 82.46"
        stroke="url(#mefinx-fall)"
      />
      <path
        d="M65.5 82.46C70.92 82.69 72.69 77.7 72.89 73.15C73.33 63.12 68.56 59.46 65.06 52.2C64.62 51.3 63.98 50.33 63.7 49.37C63.61 49.07 63.98 48.89 63.86 48.61"
        stroke="url(#mefinx-rise)"
      />
      <path
