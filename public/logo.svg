      <stop offset="0.17" stop-color="#e6b847" />
      <stop offset="0.31" stop-color="#ecbc4c" />
      <stop offset="0.89" stop-color="#e49b4b" />
      <stop offset="1" stop-color="#de975a" />
    </linearGradient>
    <filter id="mefinx-wash" x="-25%" y="-25%" width="150%" height="150%">
