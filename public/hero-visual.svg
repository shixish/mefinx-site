<line class="flow" x1="185" y1="225" x2="400" y2="330" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.55"/>
<line class="flow" x1="185" y1="225" x2="225" y2="470" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.55"/>
<line class="flow" x1="250" y1="700" x2="580" y2="450" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.55"/>
<line class="flow" x1="250" y1="700" x2="420" y2="610" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.55"/>
