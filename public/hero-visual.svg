<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 110 700 700" width="800" height="800" role="img" aria-label="A graph of people, places and events linked by their relationships">
<style>
.label{font:600 19px Inter,system-ui,sans-serif;fill:#e5e7eb}
.initial{font:700 26px Inter,system-ui,sans-serif;fill:#fff}
.flow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.08;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g stroke-linecap="round" fill="none">
